# tmux — linked to ~/.tmux.conf via install.sh
# Same “config lives in the repo, home is a symlink” pattern as nvim/wezterm.
# Tuned for long agent sessions (herdr / coding CLIs) without fighting defaults.

# ── Terminal / color ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000

# ── Indexing ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Mouse / keys ──────────────────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi

# ── Prefix stays C-b (compatible with herdr and muscle memory) ────────────────
# Faster reload of this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits inherit current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-ish pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with Alt+arrows (no prefix)
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 3
bind -n M-Down  resize-pane -D 3

# ── Status (minimal) ──────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left  "#[bold]#S #[default]| "
set -g status-right "#{?client_prefix,#[bold]prefix #[default]| ,}%Y-%m-%d %H:%M "
set -g status-style "bg=default,fg=default"
setw -g window-status-current-style "bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "

# Activity
setw -g monitor-activity on
set -g visual-activity off
